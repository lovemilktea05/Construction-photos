</style></head><body><div class="app"><div class="top"><b>現場照片報告</b><div style="display:flex;gap:6px"><button onclick="openBackup()">備份</button><button onclick="settings()">公司設定</button></div></div><div class="wrap" id="v"></div></div><script>
const K="photo_report_v1";
let d=JSON.parse(localStorage.getItem(K)||'{"settings":{},"jobs":[]}');
d.settings=d.settings||{};
d.jobs=(d.jobs||[]).map(j=>({...j,photos:j.photos||[],archived:!!j.archived}));
const sv=()=>localStorage.setItem(K,JSON.stringify(d)),
id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2),
e=s=>String(s||"").replace(/[&<>"]/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[x])),
today=()=>new Date().toISOString().slice(0,10);
let homeArchiveMode=false;
function isSigned(j){return !!(j&&j.signature)}
function requireUnlocked(j){
  if(isSigned(j)){alert('這份報告已由客戶簽認。若要修改內容，請先解除簽名。');return false}
  return true;
}
function daysSince(iso){if(!iso)return 9999;return Math.floor((Date.now()-new Date(iso).getTime())/86400000)}
function maybeShowTutorial(){if(d.settings.tutorialSeen||d.jobs.length)return;setTimeout(showTutorial,80)}
function showTutorial(){
  v.innerHTML=`<div class="card"><h2>第一次使用</h2>
  <div class="tutorial-step"><div class="tutorial-num">1</div><div><b>新增工作</b><div class="muted">填客戶、地址、施工日期與工作內容。</div></div></div>
  <div class="tutorial-step"><div class="tutorial-num">2</div><div><b>加入照片</b><div class="muted">把照片分成施工前、施工中、完工。</div></div></div>
  <div class="tutorial-step"><div class="tutorial-num">3</div><div><b>產生報告</b><div class="muted">客戶確認後直接手寫簽名，再下載正式 PDF。</div></div></div>
  <button class="primary" style="width:100%" onclick="finishTutorial()">開始使用</button></div>`;
}
function finishTutorial(){d.settings.tutorialSeen=true;sv();home()}

function home(){
 const q=(window.__homeQuery||'').toLowerCase().trim();
 const list=d.jobs.filter(j=>!!j.archived===homeArchiveMode).filter(j=>{
   if(!q)return true;
   return [j.title,j.client,j.address].some(x=>String(x||'').toLowerCase().includes(q));
 }).slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));
 const backupWarn=daysSince(d.settings.lastBackupAt)>=14;
 v.innerHTML=`${backupWarn?`<div class="notice"><b>建議備份資料</b><br>${d.settings.lastBackupAt?'距離上次備份已超過 14 天。':'目前尚未下載過完整備份。'} <button style="margin-left:6px" onclick="openBackup()">前往備份</button></div>`:''}
 <div class="card"><button class="primary" style="width:100%" onclick="edit()">＋ 新增工作</button></div>
 <div class="card">
   <div class="statusbar">
     <button class="${!homeArchiveMode?'primary':''}" onclick="homeArchiveMode=false;home()">進行中</button>
     <button class="${homeArchiveMode?'primary':''}" onclick="homeArchiveMode=true;home()">已封存</button>
   </div>
   <div class="searchbar"><input id="homeSearch" placeholder="搜尋工作、客戶或地址" value="${e(window.__homeQuery||'')}" oninput="window.__homeQuery=this.value;home()"></div>
   <h2>${homeArchiveMode?'已封存工作':'工作紀錄'}</h2>
   ${list.length?list.map(j=>`<div class="job"><div style="min-width:0;flex:1"><b>${e(j.title)}</b><div class="muted">${e(j.client)}・${e(j.date)}</div>${j.signature?'<span class="signed-badge">已簽認</span>':''}${j.archived?'<span class="archive-badge">已封存</span>':''}</div><button onclick="openJ('${j.id}')">開啟</button></div>`).join(""):'<div class="muted">'+(q?'找不到符合資料':'目前沒有資料')+'</div>'}
 </div>`;
 maybeShowTutorial();
}
function edit(x){let j=d.jobs.find(a=>a.id===x)||{id:id(),date:today(),photos:[]};if(x&&!requireUnlocked(j))return;v.innerHTML=`<div class="card"><h2>${x?"編輯":"新增"}工作</h2><div class="field"><label>工作名稱</label><input id="t" value="${e(j.title)}" placeholder="例如：王宅冷氣安裝"></div><div class="field"><label>客戶</label><input id="c" value="${e(j.client)}"></div><div class="field"><label>施工日期</label><input id="dt" type="date" value="${j.date}"></div><div class="field"><label>施工地址</label><input id="a" value="${e(j.address)}"></div><div class="field"><label>施工人員</label><input id="w" value="${e(j.worker)}"></div><div class="field"><label>工作內容</label><textarea id="n">${e(j.note)}</textarea></div><div class="actions"><button onclick="${x?`openJ('${x}')`:"home()"}">取消</button><button class="primary" onclick="saveJ('${j.id}',${!!x})">儲存</button></div></div>`}
function saveJ(x,old){let z={id:x,title:t.value,client:c.value,date:dt.value,address:a.value,worker:w.value,note:n.value,photos:[]};if(old){let q=d.jobs.find(j=>j.id===x);z.photos=q.photos;z.signature=q.signature||'';z.signedAt=q.signedAt||'';z.archived=!!q.archived;Object.assign(q,z)}else d.jobs.push(z);sv();openJ(x)}
function ensurePhotoIds(j){let changed=false;(j.photos||[]).forEach(p=>{if(!p.id){p.id=id();changed=true}});if(changed)sv();}
function openJ(x){
 let j=d.jobs.find(q=>q.id===x);if(!j)return home();ensurePhotoIds(j);
 let st=["施工前","施工中","完工"];
 v.innerHTML=`<div class="card"><h2>${e(j.title)}</h2><div class="muted">${e(j.client)}・${e(j.date)}・${e(j.address)}</div><p>${e(j.note)}</p>
 ${j.signature?`<div class="locked"><b>此報告已簽認並鎖定</b><br>簽認時間：${e(j.signedAt||'')}<br>若要修改內容，需先解除簽名。</div>`:''}
 <div class="actions"><button onclick="home()">返回</button><button onclick="edit('${x}')" ${j.signature?'disabled':''}>編輯資料</button><button class="primary" onclick="add('${x}')" ${j.signature?'disabled':''}>＋照片</button></div>
 <div class="actions" style="margin-top:8px">${j.signature?`<button onclick="unlockSignature('${x}')">解除簽名</button>`:''}<button onclick="toggleArchive('${x}')">${j.archived?'取消封存':'封存'}</button><button onclick="deleteJob('${x}')" style="color:#b42318">刪除工作</button></div></div>
 ${st.map(stage=>{let ps=j.photos.filter(p=>p.stage===stage);return `<div class="card"><h2>${stage} <span class="muted">${ps.length} 張</span></h2><div class="photos">${ps.map((p,idx)=>`<div class="photo"><img src="${p.data}" onclick="editPhoto('${x}','${p.id}')"><div><div>${e(p.note)||'<span class="muted">尚未填寫說明</span>'}</div><div class="actions" style="margin-top:6px"><button type="button" onclick="editPhoto('${x}','${p.id}')" ${j.signature?'disabled':''}>✎ 編輯／換圖</button><button type="button" onclick="delPhoto('${x}','${p.id}')" ${j.signature?'disabled':''}>刪除</button></div><div class="photo-order"><button type="button" onclick="movePhoto('${x}','${p.id}',-1)" ${idx===0||j.signature?'disabled':''}>↑ 上移</button><button type="button" onclick="movePhoto('${x}','${p.id}',1)" ${idx===ps.length-1||j.signature?'disabled':''}>↓ 下移</button></div></div></div>`).join("")}</div></div>`}).join("")}
 <div class="card"><h2>產生報告</h2><div class="actions"><button class="primary" onclick="report('${x}',0)">施工紀錄</button><button onclick="report('${x}',1)">施工前後對照</button></div></div>`;
}
function movePhoto(jid,pid,dir){
 const j=d.jobs.find(q=>q.id===jid);if(!j||!requireUnlocked(j))return;
 const p=j.photos.find(q=>q.id===pid);if(!p)return;
 const same=j.photos.filter(q=>q.stage===p.stage);
 const idx=same.findIndex(q=>q.id===pid),target=same[idx+dir];if(!target)return;
 const a=j.photos.findIndex(q=>q.id===p.id),b=j.photos.findIndex(q=>q.id===target.id);
 [j.photos[a],j.photos[b]]=[j.photos[b],j.photos[a]];sv();openJ(jid);
}
function toggleArchive(jid){const j=d.jobs.find(q=>q.id===jid);if(!j)return;j.archived=!j.archived;sv();homeArchiveMode=!!j.archived;home()}
function deleteJob(jid){const j=d.jobs.find(q=>q.id===jid);if(!j)return;if(!confirm(`確定刪除「${j.title||'這筆工作'}」？此動作無法復原。`))return;d.jobs=d.jobs.filter(q=>q.id!==jid);sv();home()}
function unlockSignature(jid){const j=d.jobs.find(q=>q.id===jid);if(!j)return;if(!confirm('解除簽名後，這份報告可再次修改。確定解除客戶簽名嗎？'))return;j.signature='';j.signedAt='';sv();openJ(jid)}
function add(x){let j0=d.jobs.find(q=>q.id===x);if(!j0||!requireUnlocked(j0))return;v.innerHTML=`<div class="card"><h2>加入照片</h2><div class="field"><label>分類</label><select id="st"><option>施工前</option><option>施工中</option><option>完工</option></select></div><div class="field"><label>說明</label><input id="pn"></div><div class="field"><label>照片</label><input id="fs" type="file" accept="image/*" multiple></div><div class="actions"><button onclick="openJ('${x}')">取消</button><button class="primary" onclick="saveP('${x}')">加入</button></div></div>`}
async function data(f){return new Promise(r=>{let rd=new FileReader();rd.onload=q=>{let im=new Image();im.onload=()=>{let z=Math.min(1,1400/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*z;c.height=im.height*z;c.getContext("2d").drawImage(im,0,0,c.width,c.height);r(c.toDataURL("image/jpeg",.76))};im.src=q.target.result};rd.readAsDataURL(f)})}
async function saveP(x){let j=d.jobs.find(q=>q.id===x),f=[...fs.files];if(!f.length)return alert("請選照片");for(let q of f)j.photos.push({id:id(),stage:st.value,note:pn.value,data:await data(q)});sv();openJ(x)}

function editPhoto(jid,pid){
 let j=d.jobs.find(q=>q.id===jid);if(!j||!requireUnlocked(j))return;ensurePhotoIds(j);
 let p=j.photos.find(q=>q.id===pid);if(!p){alert('找不到這張照片');return}
 v.innerHTML=`<div class="card"><h2>編輯照片</h2>
 <div class="field"><label>照片分類</label><select id="editStage"><option ${p.stage==='施工前'?'selected':''}>施工前</option><option ${p.stage==='施工中'?'selected':''}>施工中</option><option ${p.stage==='完工'?'selected':''}>完工</option></select></div>
 <div class="field"><label>照片說明</label><input id="editNote" value="${e(p.note)}" placeholder="輸入這張照片的說明"></div>
 <div class="field"><label>目前照片</label><img src="${p.data}" style="width:100%;max-height:330px;object-fit:contain;border:1px solid #ddd;border-radius:10px"></div>
 <div class="field"><label>更換成其他照片（不更換可留空）</label><input id="editFile" type="file" accept="image/*"></div>
 <div class="actions"><button type="button" onclick="openJ('${jid}')">取消</button><button type="button" class="primary" onclick="savePhotoEdit('${jid}','${pid}')">儲存變更</button></div></div>`;
}
async function savePhotoEdit(jid,pid){

async function downloadFormalPDF(jid){
 const j=d.jobs.find(q=>q.id===jid);if(!j)return;
 const source=document.getElementById('reportPrintArea');if(!source)return alert('找不到報告內容。');
 if(!window.html2canvas||!window.jspdf)return alert('PDF 元件尚未載入完成，請確認網路連線後再試一次。');
 try{
   const holder=document.createElement('div');
   holder.style.position='fixed';holder.style.left='-10000px';holder.style.top='0';holder.style.width='794px';holder.style.background='#fff';holder.style.color='#111';holder.style.padding='28px';holder.style.boxSizing='border-box';
   const clone=source.cloneNode(true);clone.style.width='100%';clone.style.maxWidth='none';clone.style.margin='0';clone.style.padding='0';
   holder.appendChild(clone);document.body.appendChild(holder);
   const canvas=await html2canvas(holder,{scale:2,backgroundColor:'#fff',useCORS:true,logging:false,windowWidth:794});
   holder.remove();
   const {jsPDF}=window.jspdf,pdf=new jsPDF({orientation:'p',unit:'mm',format:'a4',compress:true});
   const pageW=210,pageH=297,margin=8,usableW=pageW-margin*2,usableH=pageH-margin*2;
   const imgW=usableW,pxPerMm=canvas.width/imgW,slicePx=Math.floor(usableH*pxPerMm);
   let y=0,page=0;
   while(y<canvas.height){
     const h=Math.min(slicePx,canvas.height-y),part=document.createElement('canvas');
     part.width=canvas.width;part.height=h;
     part.getContext('2d').drawImage(canvas,0,y,canvas.width,h,0,0,canvas.width,h);
     const data=part.toDataURL('image/jpeg',0.95);
     if(page>0)pdf.addPage();
     pdf.addImage(data,'JPEG',margin,margin,imgW,h/pxPerMm,undefined,'FAST');
     y+=h;page++;
   }
   const clean=v=>String(v||'').replace(/[\\/:*?"<>|]/g,'_').trim();
   pdf.save(`${clean(j.client)||'客戶'}_${clean(j.title)||'工作紀錄'}_${clean(j.date)||today()}.pdf`);
 }catch(err){console.error(err);alert('PDF 產生失敗，請稍後再試。');}
}
let sigCtx=null,sigDrawing=false,sigHasInk=false;
function initSignaturePad(){
 const c=document.getElementById('signCanvas');if(!c)return;
 c.setAttribute('draggable','false');
 c.style.touchAction='none';
 c.style.webkitTouchCallout='none';
 c.style.webkitUserSelect='none';
 c.oncontextmenu=ev=>{ev.preventDefault();return false};
 c.ondragstart=ev=>{ev.preventDefault();return false};
 c.onselectstart=ev=>{ev.preventDefault();return false};
 const panel=c.closest('.signature-panel');
 if(panel){
   panel.oncontextmenu=ev=>{ev.preventDefault();return false};
   panel.onselectstart=ev=>{ev.preventDefault();return false};
 }
 const cssW=Math.max(280,c.clientWidth||320),cssH=180,ratio=Math.max(window.devicePixelRatio||1,1);
 c.width=Math.round(cssW*ratio);c.height=Math.round(cssH*ratio);
 c.style.height=cssH+'px';
 sigCtx=c.getContext('2d');
 sigCtx.setTransform(ratio,0,0,ratio,0,0);
 sigCtx.lineWidth=2.6;sigCtx.lineCap='round';sigCtx.lineJoin='round';sigCtx.strokeStyle='#111';
 sigHasInk=false;

 const point=ev=>{
   const r=c.getBoundingClientRect();
   const t=(ev.touches&&ev.touches[0])||(ev.changedTouches&&ev.changedTouches[0])||ev;
   return {x:t.clientX-r.left,y:t.clientY-r.top};
 };
 const start=ev=>{
   ev.preventDefault();
   sigDrawing=true;
   const p=point(ev);
   sigCtx.beginPath();
   sigCtx.moveTo(p.x,p.y);
 };
 const move=ev=>{
   if(!sigDrawing)return;
   ev.preventDefault();
   const p=point(ev);
   sigCtx.lineTo(p.x,p.y);
   sigCtx.stroke();
   sigHasInk=true;
 };
 const stop=ev=>{
   if(!sigDrawing)return;
   ev.preventDefault();
   sigDrawing=false;
 };

 c.addEventListener('touchstart',start,{passive:false});
 c.addEventListener('touchmove',move,{passive:false});
 c.addEventListener('touchend',stop,{passive:false});
 c.addEventListener('touchcancel',stop,{passive:false});
 if(window.PointerEvent){
   c.addEventListener('pointerdown',start,{passive:false});
   c.addEventListener('pointermove',move,{passive:false});
   c.addEventListener('pointerup',stop,{passive:false});
   c.addEventListener('pointercancel',stop,{passive:false});
   c.addEventListener('pointerleave',stop,{passive:false});
 }else{
   c.addEventListener('mousedown',start);
   c.addEventListener('mousemove',move);
   window.addEventListener('mouseup',stop);
 }
}
function clearSignature(){
 const c=document.getElementById('signCanvas');
 if(c&&sigCtx){
   sigCtx.clearRect(0,0,c.width,c.height);
   sigHasInk=false;
 }
}
function updateSignButton(){
 const chk=document.getElementById('signConfirmCheck');
 const btn=document.getElementById('saveSignBtn');
 if(!btn)return;

}
function saveSignature(jid){
 const c=document.getElementById('signCanvas'),j=d.jobs.find(q=>q.id===jid);
 if(!c||!j)return;
 if(!sigHasInk){alert('請先在簽名框內簽名。');return;}
 const chk=document.getElementById('signConfirmCheck');
 if(!chk||!chk.checked){alert('請先勾選「我已確認報告內容無誤」。');return;}
 if(!confirm('簽名確認後會寫入這份報告，確定要儲存嗎？'))return;
 j.signature=c.toDataURL('image/png');
 j.signedAt=new Date().toLocaleString('zh-TW');
 sv();

}

function exportBackup(){
 try{
   d.settings=d.settings||{};d.settings.lastBackupAt=new Date().toISOString();sv();
   const payload={app:'現場照片報告工具',version:2,exportedAt:d.settings.lastBackupAt,data:d};
   const blob=new Blob([JSON.stringify(payload)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');
   const company=(d.settings&&d.settings.company)||'現場照片報告',date=new Date().toISOString().slice(0,10);
   a.href=url;a.download=(company+'_'+date+'_完整備份.json').replace(/[\\/:*?"<>|]/g,'_');
   document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);alert('完整備份已下載。');
 }catch(err){alert('備份失敗，請稍後再試。');}
}

function importBackup(ev){
 const file=ev.target.files&&ev.target.files[0];if(!file)return;
 const r=new FileReader();
 r.onload=()=>{
   try{
     const parsed=JSON.parse(r.result);
     const incoming=parsed.data||parsed;
     if(!incoming||!Array.isArray(incoming.jobs))throw new Error('格式錯誤');
     if(confirm('匯入備份會覆蓋目前這支裝置內的資料，確定繼續嗎？')){
       d={settings:incoming.settings||{},jobs:incoming.jobs||[]};
       sv();
       alert('備份已成功還原。');
       home();
     }
   }catch(err){alert('這個備份檔無法讀取。');}
   finally{ev.target.value='';}
 };
 r.readAsText(file);
}
