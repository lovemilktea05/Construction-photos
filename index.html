<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>現場照片報告</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;color:#18212a}.app{max-width:720px;margin:auto}.top{position:sticky;top:0;background:#fff;border-bottom:1px solid #ddd;padding:15px;display:flex;justify-content:space-between;z-index:2}.wrap{padding:14px}.card{background:#fff;border:1px solid #dfe4e8;border-radius:15px;padding:14px;margin-bottom:12px}h2{font-size:17px;margin:0 0 12px}.field{margin-bottom:10px}label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}input,select,textarea{width:100%;padding:11px;border:1px solid #ccd3d8;border-radius:10px;font:inherit}textarea{min-height:70px}button{border:0;border-radius:10px;padding:10px 13px;font-weight:700;background:#e8edf0}button.primary{background:#243746;color:#fff}.actions{display:flex;gap:8px}.actions>*{flex:1}.muted{color:#68737d;font-size:13px}.job{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee;padding:10px 0}.photos,.report-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.photo{border:1px solid #ddd;border-radius:10px;overflow:hidden}.photo img{width:100%;aspect-ratio:4/3;object-fit:cover}.photo div{padding:7px;font-size:12px}.report{background:#fff;padding:20px}.report h1{text-align:center}.report-item{border:1px solid #aaa;padding:6px;break-inside:avoid}.report-item img{width:100%;height:180px;object-fit:contain}.sign{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:35px}.sign-box{min-height:5.2cm;text-align:center;display:flex;flex-direction:column;justify-content:flex-end}.sign-space{height:4cm;display:flex;align-items:center;justify-content:center}.sign-space img{max-width:3.6cm;max-height:3.6cm;object-fit:contain;display:block}.sign-line{border-top:1px solid #222;padding-top:7px;font-size:13px}.company-meta{font-size:12px;margin-top:3px;color:#333}.compare{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.compare>div{border:1px solid #aaa;padding:6px;text-align:center}.compare img{width:100%;height:180px;object-fit:contain}@media print{.top,.no-print{display:none!important}.wrap{padding:0}.card{border:0}.report{padding:10mm}}
</style></head><body><div class="app"><div class="top"><b>現場照片報告</b><button onclick="settings()">公司設定</button></div><div class="wrap" id="v"></div></div><script>
const K="photo_report_v1";let d=JSON.parse(localStorage.getItem(K)||'{"settings":{},"jobs":[]}');const sv=()=>localStorage.setItem(K,JSON.stringify(d)),id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2),e=s=>String(s||"").replace(/[&<>"]/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[x])),today=()=>new Date().toISOString().slice(0,10);
function home(){v.innerHTML=`<div class="card"><button class="primary" style="width:100%" onclick="edit()">＋ 新增工作</button></div><div class="card"><h2>工作紀錄</h2>${d.jobs.length?d.jobs.slice().reverse().map(j=>`<div class="job"><div><b>${e(j.title)}</b><div class="muted">${e(j.client)}・${e(j.date)}</div></div><button onclick="openJ('${j.id}')">開啟</button></div>`).join(""):'<div class="muted">還沒有工作紀錄</div>'}</div>`}
function edit(x){let j=d.jobs.find(a=>a.id===x)||{id:id(),date:today(),photos:[]};v.innerHTML=`<div class="card"><h2>${x?"編輯":"新增"}工作</h2><div class="field"><label>工作名稱</label><input id="t" value="${e(j.title)}" placeholder="例如：王宅冷氣安裝"></div><div class="field"><label>客戶</label><input id="c" value="${e(j.client)}"></div><div class="field"><label>施工日期</label><input id="dt" type="date" value="${j.date}"></div><div class="field"><label>施工地址</label><input id="a" value="${e(j.address)}"></div><div class="field"><label>施工人員</label><input id="w" value="${e(j.worker)}"></div><div class="field"><label>工作內容</label><textarea id="n">${e(j.note)}</textarea></div><div class="actions"><button onclick="${x?`openJ('${x}')`:"home()"}">取消</button><button class="primary" onclick="saveJ('${j.id}',${!!x})">儲存</button></div></div>`}
function saveJ(x,old){let z={id:x,title:t.value,client:c.value,date:dt.value,address:a.value,worker:w.value,note:n.value,photos:[]};if(old){let q=d.jobs.find(j=>j.id===x);z.photos=q.photos;Object.assign(q,z)}else d.jobs.push(z);sv();openJ(x)}
function openJ(x){let j=d.jobs.find(q=>q.id===x),st=["施工前","施工中","完工"];v.innerHTML=`<div class="card"><h2>${e(j.title)}</h2><div class="muted">${e(j.client)}・${e(j.date)}・${e(j.address)}</div><p>${e(j.note)}</p><div class="actions"><button onclick="home()">返回</button><button onclick="edit('${x}')">編輯</button><button class="primary" onclick="add('${x}')">＋照片</button></div></div>${st.map(s=>{let ps=j.photos.filter(p=>p.stage===s);return `<div class="card"><h2>${s} <span class="muted">${ps.length} 張</span></h2><div class="photos">${ps.map(p=>`<div class="photo"><img src="${p.data}"><div>${e(p.note)}</div></div>`).join("")}</div></div>`}).join("")}<div class="card"><h2>產生報告</h2><div class="actions"><button class="primary" onclick="report('${x}',0)">施工紀錄</button><button onclick="report('${x}',1)">施工前後對照</button></div></div>`}
function add(x){v.innerHTML=`<div class="card"><h2>加入照片</h2><div class="field"><label>分類</label><select id="st"><option>施工前</option><option>施工中</option><option>完工</option></select></div><div class="field"><label>說明</label><input id="pn"></div><div class="field"><label>照片</label><input id="fs" type="file" accept="image/*" multiple></div><div class="actions"><button onclick="openJ('${x}')">取消</button><button class="primary" onclick="saveP('${x}')">加入</button></div></div>`}
async function data(f){return new Promise(r=>{let rd=new FileReader();rd.onload=q=>{let im=new Image();im.onload=()=>{let z=Math.min(1,1400/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*z;c.height=im.height*z;c.getContext("2d").drawImage(im,0,0,c.width,c.height);r(c.toDataURL("image/jpeg",.76))};im.src=q.target.result};rd.readAsDataURL(f)})}
async function saveP(x){let j=d.jobs.find(q=>q.id===x),f=[...fs.files];if(!f.length)return alert("請選照片");for(let q of f)j.photos.push({stage:st.value,note:pn.value,data:await data(q)});sv();openJ(x)}
function report(x,cmp){let j=d.jobs.find(q=>q.id===x),s=d.settings.company||"現場工作紀錄",body;if(!cmp)body=["施工前","施工中","完工"].map(z=>{let ps=j.photos.filter(p=>p.stage===z);return ps.length?`<h2>${z}</h2><div class="report-grid">${ps.map(p=>`<div class="report-item"><img src="${p.data}"><div>${e(p.note)}</div></div>`).join("")}</div>`:""}).join("");else{let b=j.photos.filter(p=>p.stage==="施工前"),a=j.photos.filter(p=>p.stage==="完工"),m=Math.max(b.length,a.length);body=`<h2>施工前後對照</h2>${Array.from({length:m},(_,i)=>`<div class="compare"><div><b>施工前</b>${b[i]?`<img src="${b[i].data}"><small>${e(b[i].note)}</small>`:""}</div><div><b>完工</b>${a[i]?`<img src="${a[i].data}"><small>${e(a[i].note)}</small>`:""}</div></div>`).join("")}`}v.innerHTML=`<div class="card no-print actions"><button onclick="openJ('${x}')">返回</button><button class="primary" onclick="print()">儲存／列印 PDF</button></div><div class="report"><h1>${e(s)}</h1><p><b>工作：</b>${e(j.title)}　<b>日期：</b>${e(j.date)}<br><b>客戶：</b>${e(j.client)}　<b>施工人員：</b>${e(j.worker)}<br><b>地址：</b>${e(j.address)}</p><hr>${body}<div class="sign">
<div class="sign-box"><div class="sign-space"></div><div class="sign-line">客戶簽認</div></div>
<div class="sign-box"><div class="sign-space">${d.settings.stamp?`<img src="${d.settings.stamp}" alt="公司統編章">`:''}</div><div class="sign-line">${e(s)}${d.settings.taxId?`<div class="company-meta">統一編號：${e(d.settings.taxId)}</div>`:''}</div></div>
</div></div>`}
let pendingStamp=null;
function settings(){
 let s=d.settings||{};
 v.innerHTML=`<div class="card"><h2>公司設定</h2>
 <div class="field"><label>公司／工作室名稱</label><input id="co" value="${e(s.company)}"></div>
 <div class="field"><label>統一編號</label><input id="tax" inputmode="numeric" value="${e(s.taxId)}"></div>
 <div class="field"><label>電話</label><input id="ph" value="${e(s.phone)}"></div>
 <div class="field"><label>公司統編章／發票章</label><input id="stampFile" type="file" accept="image/png,image/jpeg,image/webp" onchange="previewStamp(this)"></div>
 <div class="card" style="text-align:center;padding:10px">${s.stamp?`<img src="${s.stamp}" style="max-width:180px;max-height:110px;object-fit:contain">`:'<span class="muted">尚未上傳公司章</span>'}</div>
 ${s.stamp?'<button style="width:100%;margin-bottom:10px" onclick="removeStamp()">移除公司章</button>':''}
 <div class="actions"><button onclick="home()">取消</button><button class="primary" onclick="saveSettings()">儲存</button></div></div>`;
}
function previewStamp(input){
 const f=input.files&&input.files[0]; if(!f)return;
 const r=new FileReader();
 r.onload=()=>{pendingStamp=r.result; const img=document.createElement('img'); img.src=pendingStamp;};
 r.readAsDataURL(f);
}
function removeStamp(){
 if(!confirm('確定移除目前公司章？'))return;
 d.settings.stamp=''; pendingStamp=null; sv(); settings();
}
function saveSettings(){
 d.settings=d.settings||{};
 d.settings.company=co.value.trim();
 d.settings.taxId=tax.value.trim();
 d.settings.phone=ph.value.trim();
 if(pendingStamp){d.settings.stamp=pendingStamp;pendingStamp=null;}
 sv();home();
}
home();
</script></body></html>
