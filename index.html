<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>現場照片報告</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;color:#18212a}.app{max-width:720px;margin:auto}.top{position:sticky;top:0;background:#fff;border-bottom:1px solid #ddd;padding:15px;display:flex;justify-content:space-between;z-index:2}.wrap{padding:14px}.card{background:#fff;border:1px solid #dfe4e8;border-radius:15px;padding:14px;margin-bottom:12px}h2{font-size:17px;margin:0 0 12px}.field{margin-bottom:10px}label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}input,select,textarea{width:100%;padding:11px;border:1px solid #ccd3d8;border-radius:10px;font:inherit}textarea{min-height:70px}button{border:0;border-radius:10px;padding:10px 13px;font-weight:700;background:#e8edf0}button.primary{background:#243746;color:#fff}.actions{display:flex;gap:8px}.actions>*{flex:1}.muted{color:#68737d;font-size:13px}.job{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee;padding:10px 0}.photos,.report-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.photo{border:1px solid #ddd;border-radius:10px;overflow:hidden}.photo img{width:100%;aspect-ratio:4/3;object-fit:cover}.photo div{padding:7px;font-size:12px}.report{background:#fff;padding:20px}.report h1{text-align:center}.report-item{border:1px solid #aaa;padding:6px;break-inside:avoid}.report-item img{width:100%;height:180px;object-fit:contain}.sign{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:35px}.sign-box{min-height:5.2cm;text-align:center;display:flex;flex-direction:column;justify-content:flex-end}.sign-space{height:4cm;display:flex;align-items:center;justify-content:center}.sign-space img{max-width:3.6cm;max-height:3.6cm;object-fit:contain;display:block}.sign-line{border-top:1px solid #222;padding-top:7px;font-size:13px}.company-meta{font-size:12px;margin-top:3px;color:#333}.compare{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.compare>div{border:1px solid #aaa;padding:6px;text-align:center}.compare img{width:100%;height:180px;object-fit:contain}.signature-panel{margin-top:14px}.signature-canvas{width:100%;height:180px;border:1px dashed #9aa4ad;border-radius:12px;background:#fff;touch-action:none;display:block}.signature-tools{display:flex;gap:8px;margin-top:8px}.signature-tools button{flex:1}.signed-preview{max-width:100%;max-height:3.4cm;object-fit:contain;display:block;margin:auto}
@media print{.top,.no-print{display:none!important}.wrap{padding:0}.card{border:0}.report{padding:10mm}}
</style></head><body><div class="app"><div class="top"><b>現場照片報告</b><div style="display:flex;gap:6px"><button onclick="openBackup()">備份</button><button onclick="settings()">公司設定</button></div></div><div class="wrap" id="v"></div></div><script>
const K="photo_report_v1";let d=JSON.parse(localStorage.getItem(K)||'{"settings":{},"jobs":[]}');const sv=()=>localStorage.setItem(K,JSON.stringify(d)),id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2),e=s=>String(s||"").replace(/[&<>"]/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[x])),today=()=>new Date().toISOString().slice(0,10);
function home(){v.innerHTML=`<div class="card"><button class="primary" style="width:100%" onclick="edit()">＋ 新增工作</button></div><div class="card"><h2>工作紀錄</h2>${d.jobs.length?d.jobs.slice().reverse().map(j=>`<div class="job"><div><b>${e(j.title)}</b><div class="muted">${e(j.client)}・${e(j.date)}</div></div><button onclick="openJ('${j.id}')">開啟</button></div>`).join(""):'<div class="muted">還沒有工作紀錄</div>'}</div>`}
function edit(x){let j=d.jobs.find(a=>a.id===x)||{id:id(),date:today(),photos:[]};v.innerHTML=`<div class="card"><h2>${x?"編輯":"新增"}工作</h2><div class="field"><label>工作名稱</label><input id="t" value="${e(j.title)}" placeholder="例如：王宅冷氣安裝"></div><div class="field"><label>客戶</label><input id="c" value="${e(j.client)}"></div><div class="field"><label>施工日期</label><input id="dt" type="date" value="${j.date}"></div><div class="field"><label>施工地址</label><input id="a" value="${e(j.address)}"></div><div class="field"><label>施工人員</label><input id="w" value="${e(j.worker)}"></div><div class="field"><label>工作內容</label><textarea id="n">${e(j.note)}</textarea></div><div class="actions"><button onclick="${x?`openJ('${x}')`:"home()"}">取消</button><button class="primary" onclick="saveJ('${j.id}',${!!x})">儲存</button></div></div>`}
function saveJ(x,old){let z={id:x,title:t.value,client:c.value,date:dt.value,address:a.value,worker:w.value,note:n.value,photos:[]};if(old){let q=d.jobs.find(j=>j.id===x);z.photos=q.photos;Object.assign(q,z)}else d.jobs.push(z);sv();openJ(x)}
function ensurePhotoIds(j){let changed=false;(j.photos||[]).forEach(p=>{if(!p.id){p.id=id();changed=true}});if(changed)sv();}
function openJ(x){let j=d.jobs.find(q=>q.id===x);ensurePhotoIds(j);let st=["施工前","施工中","完工"];v.innerHTML=`<div class="card"><h2>${e(j.title)}</h2><div class="muted">${e(j.client)}・${e(j.date)}・${e(j.address)}</div><p>${e(j.note)}</p><div class="actions"><button onclick="home()">返回</button><button onclick="edit('${x}')">編輯</button><button class="primary" onclick="add('${x}')">＋照片</button></div></div>${st.map(s=>{let ps=j.photos.filter(p=>p.stage===s);return `<div class="card"><h2>${s} <span class="muted">${ps.length} 張</span></h2><div class="photos">${ps.map(p=>`<div class="photo"><img src="${p.data}" onclick="editPhoto('${x}','${p.id}')"><div><div>${e(p.note)||'<span class="muted">尚未填寫說明</span>'}</div><div class="actions" style="margin-top:6px"><button type="button" onclick="editPhoto('${x}','${p.id}')">✎ 編輯／換圖</button><button type="button" onclick="delPhoto('${x}','${p.id}')">刪除</button></div></div></div>`).join("")}</div></div>`}).join("")}<div class="card"><h2>產生報告</h2><div class="actions"><button class="primary" onclick="report('${x}',0)">施工紀錄</button><button onclick="report('${x}',1)">施工前後對照</button></div></div>`}
function add(x){v.innerHTML=`<div class="card"><h2>加入照片</h2><div class="field"><label>分類</label><select id="st"><option>施工前</option><option>施工中</option><option>完工</option></select></div><div class="field"><label>說明</label><input id="pn"></div><div class="field"><label>照片</label><input id="fs" type="file" accept="image/*" multiple></div><div class="actions"><button onclick="openJ('${x}')">取消</button><button class="primary" onclick="saveP('${x}')">加入</button></div></div>`}
async function data(f){return new Promise(r=>{let rd=new FileReader();rd.onload=q=>{let im=new Image();im.onload=()=>{let z=Math.min(1,1400/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*z;c.height=im.height*z;c.getContext("2d").drawImage(im,0,0,c.width,c.height);r(c.toDataURL("image/jpeg",.76))};im.src=q.target.result};rd.readAsDataURL(f)})}
async function saveP(x){let j=d.jobs.find(q=>q.id===x),f=[...fs.files];if(!f.length)return alert("請選照片");for(let q of f)j.photos.push({id:id(),stage:st.value,note:pn.value,data:await data(q)});sv();openJ(x)}

function editPhoto(jid,pid){
 let j=d.jobs.find(q=>q.id===jid);ensurePhotoIds(j);
 let p=j.photos.find(q=>q.id===pid);if(!p){alert('找不到這張照片');return}
 v.innerHTML=`<div class="card"><h2>編輯照片</h2>
 <div class="field"><label>照片分類</label><select id="editStage"><option ${p.stage==='施工前'?'selected':''}>施工前</option><option ${p.stage==='施工中'?'selected':''}>施工中</option><option ${p.stage==='完工'?'selected':''}>完工</option></select></div>
 <div class="field"><label>照片說明</label><input id="editNote" value="${e(p.note)}" placeholder="輸入這張照片的說明"></div>
 <div class="field"><label>目前照片</label><img src="${p.data}" style="width:100%;max-height:330px;object-fit:contain;border:1px solid #ddd;border-radius:10px"></div>
 <div class="field"><label>更換成其他照片（不更換可留空）</label><input id="editFile" type="file" accept="image/*"></div>
 <div class="actions"><button type="button" onclick="openJ('${jid}')">取消</button><button type="button" class="primary" onclick="savePhotoEdit('${jid}','${pid}')">儲存變更</button></div></div>`;
}
async function savePhotoEdit(jid,pid){
 let j=d.jobs.find(q=>q.id===jid),p=j&&j.photos.find(q=>q.id===pid);if(!p)return alert('找不到照片');
 let stEl=document.getElementById('editStage'), noteEl=document.getElementById('editNote'), fileEl=document.getElementById('editFile');
 p.stage=stEl.value;p.note=noteEl.value.trim();
 if(fileEl.files&&fileEl.files[0]){p.data=await data(fileEl.files[0]);}
 sv();openJ(jid);
}
function delPhoto(jid,pid){
 if(!confirm('確定刪除這張照片？'))return;
 let j=d.jobs.find(q=>q.id===jid);ensurePhotoIds(j);
 j.photos=j.photos.filter(q=>q.id!==pid);sv();openJ(jid);
}

function report(x,cmp){window.__reportCompare=cmp;let j=d.jobs.find(q=>q.id===x),s=d.settings.company||"現場工作紀錄",body;if(!cmp)body=["施工前","施工中","完工"].map(z=>{let ps=j.photos.filter(p=>p.stage===z);return ps.length?`<h2>${z}</h2><div class="report-grid">${ps.map(p=>`<div class="report-item"><img src="${p.data}"><div>${e(p.note)}</div></div>`).join("")}</div>`:""}).join("");else{let b=j.photos.filter(p=>p.stage==="施工前"),a=j.photos.filter(p=>p.stage==="完工"),m=Math.max(b.length,a.length);body=`<h2>施工前後對照</h2>${Array.from({length:m},(_,i)=>`<div class="compare"><div><b>施工前</b>${b[i]?`<img src="${b[i].data}"><small>${e(b[i].note)}</small>`:""}</div><div><b>完工</b>${a[i]?`<img src="${a[i].data}"><small>${e(a[i].note)}</small>`:""}</div></div>`).join("")}`}v.innerHTML=`<div class="card no-print"><div class="actions"><button onclick="openJ('${x}')">返回</button><button class="primary" onclick="print()">儲存／列印 PDF</button></div>
<div class="signature-panel"><h2 style="margin-top:14px">客戶電子簽名</h2><div class="muted">確認內容後，可直接在手機下方手寫簽名。</div><canvas id="signCanvas" class="signature-canvas"></canvas><div class="signature-tools"><button onclick="clearSignature()">清除重簽</button><button class="primary" onclick="saveSignature('${x}')">確認簽名</button></div></div></div><div class="report"><h1>${e(s)}</h1><p><b>工作：</b>${e(j.title)}　<b>日期：</b>${e(j.date)}<br><b>客戶：</b>${e(j.client)}　<b>施工人員：</b>${e(j.worker)}<br><b>地址：</b>${e(j.address)}</p><hr>${body}<div class="sign">
<div class="sign-box"><div class="sign-space">${j.signature?`<img class="signed-preview" src="${j.signature}" alt="客戶電子簽名">`:''}</div><div class="sign-line">客戶簽認${j.signedAt?`<div class="company-meta">簽認時間：${e(j.signedAt)}</div>`:''}</div></div>
<div class="sign-box"><div class="sign-space">${d.settings.stamp?`<img src="${d.settings.stamp}" alt="公司統編章">`:''}</div><div class="sign-line">${e(s)}${d.settings.taxId?`<div class="company-meta">統一編號：${e(d.settings.taxId)}</div>`:''}</div></div>
</div></div>`;setTimeout(initSignaturePad,0)}

let sigCtx=null,sigDrawing=false,sigHasInk=false;
function initSignaturePad(){
 const c=document.getElementById('signCanvas');if(!c)return;
 const cssW=Math.max(280,c.clientWidth||320),cssH=180,ratio=Math.max(window.devicePixelRatio||1,1);
 c.width=Math.round(cssW*ratio);c.height=Math.round(cssH*ratio);
 c.style.height=cssH+'px';
 sigCtx=c.getContext('2d');
 sigCtx.setTransform(ratio,0,0,ratio,0,0);
 sigCtx.lineWidth=2.6;sigCtx.lineCap='round';sigCtx.lineJoin='round';sigCtx.strokeStyle='#111';
 sigHasInk=false;

 const point=ev=>{
   const r=c.getBoundingClientRect();
   const t=(ev.touches&&ev.touches[0])||(ev.changedTouches&&ev.changedTouches[0])||ev;
   return {x:t.clientX-r.left,y:t.clientY-r.top};
 };
 const start=ev=>{
   ev.preventDefault();
   sigDrawing=true;
   const p=point(ev);
   sigCtx.beginPath();
   sigCtx.moveTo(p.x,p.y);
 };
 const move=ev=>{
   if(!sigDrawing)return;
   ev.preventDefault();
   const p=point(ev);
   sigCtx.lineTo(p.x,p.y);
   sigCtx.stroke();
   sigHasInk=true;
 };
 const stop=ev=>{
   if(!sigDrawing)return;
   ev.preventDefault();
   sigDrawing=false;
 };

 if(window.PointerEvent){
   c.addEventListener('pointerdown',start,{passive:false});
   c.addEventListener('pointermove',move,{passive:false});
   c.addEventListener('pointerup',stop,{passive:false});
   c.addEventListener('pointercancel',stop,{passive:false});
   c.addEventListener('pointerleave',stop,{passive:false});
 }else{
   c.addEventListener('touchstart',start,{passive:false});
   c.addEventListener('touchmove',move,{passive:false});
   c.addEventListener('touchend',stop,{passive:false});
   c.addEventListener('mousedown',start);
   c.addEventListener('mousemove',move);
   window.addEventListener('mouseup',stop);
 }
}
function clearSignature(){
 const c=document.getElementById('signCanvas');
 if(c&&sigCtx){
   sigCtx.clearRect(0,0,c.width,c.height);
   sigHasInk=false;
 }
}
function saveSignature(jid){
 const c=document.getElementById('signCanvas'),j=d.jobs.find(q=>q.id===jid);
 if(!c||!j)return;
 if(!sigHasInk){alert('請先在簽名框內簽名。');return;}
 j.signature=c.toDataURL('image/png');
 j.signedAt=new Date().toLocaleString('zh-TW');
 sv();
 alert('客戶簽名已儲存。');
 report(jid,window.__reportCompare||0);
}

function openBackup(){
 v.innerHTML=`<div class="card"><h2>資料備份</h2>
 <div class="muted">目前工作紀錄會自動儲存在這支裝置的瀏覽器內。建議定期下載備份，換手機時可以再匯入還原。</div>
 <div style="margin-top:12px" class="actions">
   <button class="primary" onclick="exportBackup()">下載備份</button>
   <button onclick="document.getElementById('backupFile').click()">匯入備份</button>
 </div>
 <input id="backupFile" type="file" accept=".json,application/json" style="display:none" onchange="importBackup(event)">
 <div style="margin-top:12px"><button style="width:100%" onclick="home()">返回</button></div>
 </div>`;
}
function exportBackup(){
 try{
   const payload={app:'現場照片報告工具',version:1,exportedAt:new Date().toISOString(),data:d};
   const blob=new Blob([JSON.stringify(payload)],{type:'application/json'});
   const url=URL.createObjectURL(blob);
   const a=document.createElement('a');
   const company=(d.settings&&d.settings.company)||'現場照片報告';
   const date=new Date().toISOString().slice(0,10);
   a.href=url;
   a.download=(company+'_'+date+'_完整備份.json').replace(/[\\/:*?"<>|]/g,'_');
   document.body.appendChild(a);a.click();a.remove();
   setTimeout(()=>URL.revokeObjectURL(url),1000);
 }catch(err){alert('備份失敗，請稍後再試。');}
}
function importBackup(ev){
 const file=ev.target.files&&ev.target.files[0];if(!file)return;
 const r=new FileReader();
 r.onload=()=>{
   try{
     const parsed=JSON.parse(r.result);
     const incoming=parsed.data||parsed;
     if(!incoming||!Array.isArray(incoming.jobs))throw new Error('格式錯誤');
     if(confirm('匯入備份會覆蓋目前這支裝置內的資料，確定繼續嗎？')){
       d={settings:incoming.settings||{},jobs:incoming.jobs||[]};
       sv();
       alert('備份已成功還原。');
       home();
     }
   }catch(err){alert('這個備份檔無法讀取。');}
   finally{ev.target.value='';}
 };
 r.readAsText(file);
}
let pendingStamp=null;
function settings(){
 let s=d.settings||{};
 v.innerHTML=`<div class="card"><h2>公司設定</h2>
 <div class="field"><label>公司／工作室名稱</label><input id="co" value="${e(s.company)}"></div>
 <div class="field"><label>統一編號</label><input id="tax" inputmode="numeric" value="${e(s.taxId)}"></div>
 <div class="field"><label>電話</label><input id="ph" value="${e(s.phone)}"></div>
 <div class="field"><label>公司統編章／發票章</label><input id="stampFile" type="file" accept="image/png,image/jpeg,image/webp" onchange="previewStamp(this)"></div>
 <div class="card" style="text-align:center;padding:10px">${s.stamp?`<img src="${s.stamp}" style="max-width:180px;max-height:110px;object-fit:contain">`:'<span class="muted">尚未上傳公司章</span>'}</div>
 ${s.stamp?'<button style="width:100%;margin-bottom:10px" onclick="removeStamp()">移除公司章</button>':''}
 <div class="actions"><button onclick="home()">取消</button><button class="primary" onclick="saveSettings()">儲存</button></div></div>`;
}
function previewStamp(input){
 const f=input.files&&input.files[0]; if(!f)return;
 const r=new FileReader();
 r.onload=()=>{pendingStamp=r.result; const img=document.createElement('img'); img.src=pendingStamp;};
 r.readAsDataURL(f);
}
function removeStamp(){
 if(!confirm('確定移除目前公司章？'))return;
 d.settings.stamp=''; pendingStamp=null; sv(); settings();
}
function saveSettings(){
 d.settings=d.settings||{};
 d.settings.company=co.value.trim();
 d.settings.taxId=tax.value.trim();
 d.settings.phone=ph.value.trim();
 if(pendingStamp){d.settings.stamp=pendingStamp;pendingStamp=null;}
 sv();home();
}
home();
</script></body></html>
